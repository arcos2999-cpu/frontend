<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <script>
      // La app vive en /app/: si se abrió como /app (sin diagonal), se corrige para que carguen sus archivos.
      if (!/\/$|\.html$/.test(location.pathname)) {
        location.replace(location.pathname + '/' + location.search + location.hash);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Buzón BUAP SJC</title>
    <meta name="description" content="Quejas y sugerencias de la comunidad BUAP SJC" />
    <meta name="theme-color" content="#0B4F8A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Buzón SJC" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Configuración que se puede cambiar sin volver a compilar (dirección de la API, Firebase). -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p class="noscript">Para usar el Buzón BUAP SJC necesitas activar JavaScript en tu navegador.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
